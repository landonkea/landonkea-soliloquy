# Overlay for testing the actual RELEASE image (the same "release"
# target staging/prod ship, and the .github/workflows/deploy-* pipelines
# build) before it goes anywhere real. NOT the normal dev loop --
# docker-compose.yml's own `app` service (dev target, hot reload via a
# bind mount) already covers that; see its comments and README's Quick
# start. This overlay swaps the build target to "release" and drops the
# bind mount, since the whole point is confirming the image works as
# actually built, not as edited live.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.app.yml \
#     up -d --build
#
# Defaults to .env.staging below (the more common "does this actually
# work before it ships" check); edit env_file here to point at
# .env.prod instead if that's specifically what needs testing.
services:
  app:
    build:
      context: .
      target: release
    volumes: !reset []
    env_file:
      - .env.staging
