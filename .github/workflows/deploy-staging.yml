name: Deploy (staging)

# Same shape as deploy-dev.yml, staging branch instead of dev, "staging"
# Dockerfile target instead of "dev". Same caveat applies: this builds
# and publishes the image, it doesn't push it onto a running host. See
# .env.staging's header, there's no staging host to point at yet.

on:
  push:
    branches: [staging]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: staging
          push: true
          tags: |
            ghcr.io/landonkea/landonkea-soliloquy:staging
            ghcr.io/landonkea/landonkea-soliloquy:staging-${{ github.sha }}
