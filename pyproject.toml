[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soliloquy"
version = "0.1.0"
description = "A voice-first journal: record, transcribe, and analyze your own thoughts over time."
requires-python = ">=3.10"
# psycopg/boto3 are hard dependencies, not optional extras -- every
# path through this app (CLI or web) needs Postgres storage and S3-
# compatible object storage, unlike audio/transcribe/web which are
# only needed for specific commands/interfaces.
dependencies = ["requests>=2.31", "psycopg[binary]>=3.1", "boto3>=1.34", "fpdf2>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
# Only needed for `soliloquy record` -- text-only usage (`add`/`list`)
# doesn't require a microphone library at all, and pyaudio needs the
# system-level portaudio library installed first (see README).
audio = ["pyaudio>=0.2.14"]
# Only needed for `soliloquy transcribe`/the transcribe-on-record flow.
transcribe = ["faster-whisper>=1.0.0"]
# Only needed to run the web app (`python -m soliloquy.web`).
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "jinja2>=3.1"]

[project.scripts]
soliloquy = "soliloquy.cli:main"
soliloquy-web = "soliloquy.web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
