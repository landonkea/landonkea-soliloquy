[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soliloquy"
version = "0.1.0"
description = "A voice-first journal: record, transcribe, and analyze your own thoughts over time."
requires-python = ">=3.10"
# psycopg/boto3 are hard dependencies, not optional extras -- every
# path through this app needs Postgres storage and S3-compatible
# object storage, unlike transcribe/web which are only needed for
# specific interfaces.
dependencies = [
    "requests>=2.31", "psycopg[binary]>=3.1", "boto3>=1.34", "fpdf2>=2.7",
    # Fernet symmetric encryption for the opt-in transcript-at-rest
    # feature in storage.py -- a hard dependency (not an extra) since
    # EntryStore imports it unconditionally, even though actually
    # using it requires setting TRANSCRIPT_ENCRYPTION_KEY.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
# Only needed for transcribing audio/video uploads (used by the web
# app's upload routes). deepfilternet/torch/torchaudio/soundfile back
# the voice-isolation + normalization pass that runs before
# transcription -- see noise_reduction.py.
transcribe = ["faster-whisper>=1.0.0", "deepfilternet>=0.5.6", "torch>=2.0", "torchaudio>=2.0", "soundfile>=0.12"]
# Only needed to run the web app (`python -m soliloquy.web`) -- this
# is the only interface to this app; see README.
web = [
    "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "jinja2>=3.1",
    "apscheduler>=3.10,<4", "paho-mqtt>=2.0,<3",
    # itsdangerous: signs the session cookie for auth.py's login gate
    # (Starlette's SessionMiddleware needs it but doesn't declare it
    # as a hard dependency itself).
    "itsdangerous>=2.1",
]

[project.scripts]
soliloquy-web = "soliloquy.web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
