[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soliloquy"
version = "0.1.0"
description = "A voice-first journal: record, transcribe, and analyze your own thoughts over time."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Only needed for `soliloquy record` -- text-only usage (`add`/`list`)
# doesn't require a microphone library at all, and pyaudio needs the
# system-level portaudio library installed first (see README).
audio = ["pyaudio>=0.2.14"]
# Only needed for `soliloquy transcribe`/the transcribe-on-record flow.
transcribe = ["faster-whisper>=1.0.0"]

[project.scripts]
soliloquy = "soliloquy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
