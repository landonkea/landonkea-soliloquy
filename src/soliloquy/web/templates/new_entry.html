{% extends "base.html" %}
{% block title %}New entry — Soliloquy{% endblock %}
{% block content %}
  <h1>New entry</h1>

  <div class="prompt-box">
    <div class="prompt-label">Today's prompt</div>
    <div class="prompt-text">{{ prompt }}</div>
  </div>

  <div class="card">
    <label for="entry-type">Entry type</label>
    <select id="entry-type">
      <option value="text">Text</option>
      <option value="audio">Audio</option>
      <option value="video">Video</option>
    </select>
  </div>

  <fieldset id="section-text">
    <legend>Typed entry</legend>
    <form id="text-form">
      <textarea name="text" rows="4" placeholder="What's on your mind?" required></textarea>
      <button type="submit">Save</button>
      <div class="status" id="text-status"></div>
    </form>
  </fieldset>

  <fieldset id="section-audio" style="display: none;">
    <legend>Audio entry</legend>
    <div class="capture-choice">
      <div>
        <label for="audio-upload-input">Upload from device</label>
        <input type="file" id="audio-upload-input" name="file" accept="audio/*">
        <button type="button" class="secondary" onclick="document.getElementById('audio-upload-input').click()">Choose existing file</button>
      </div>
      <div>
        <label for="audio-capture-input">Record now</label>
        <input type="file" id="audio-capture-input" name="file" accept="audio/*" capture>
        <button type="button" onclick="document.getElementById('audio-capture-input').click()">Record new audio</button>
      </div>
    </div>
    <div class="status" id="audio-status"></div>
  </fieldset>

  <fieldset id="section-video" style="display: none;">
    <legend>Video entry</legend>
    <div class="capture-choice">
      <div>
        <label for="video-upload-input">Upload from device</label>
        <input type="file" id="video-upload-input" name="file" accept="video/*">
        <button type="button" class="secondary" onclick="document.getElementById('video-upload-input').click()">Choose existing file</button>
      </div>
      <div>
        <label for="video-capture-input">Record now</label>
        <input type="file" id="video-capture-input" name="file" accept="video/*" capture="user">
        <button type="button" onclick="document.getElementById('video-capture-input').click()">Open camera &amp; record</button>
      </div>
    </div>
    <div class="status" id="video-status"></div>
  </fieldset>

  <script>
    // ── Entry type selector: shows/hides the relevant section. ──────
    const typeSelect = document.getElementById("entry-type");
    const sections = { text: "section-text", audio: "section-audio", video: "section-video" };
    typeSelect.addEventListener("change", () => {
      for (const [type, id] of Object.entries(sections)) {
        document.getElementById(id).style.display = type === typeSelect.value ? "block" : "none";
      }
    });

    // ── Shared upload/save logic ──────────────────────────────────
    async function submitEntry(url, body, statusEl) {
      statusEl.textContent = "Uploading...";
      statusEl.className = "status";
      try {
        const response = await fetch(url, { method: "POST", body });
        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          throw new Error(detail.detail || `Request failed (${response.status})`);
        }
        statusEl.textContent = "Saved. Redirecting...";
        statusEl.className = "status ok";
        window.location.href = "/";
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.className = "status error";
      }
    }

    document.getElementById("text-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const body = new FormData(event.target);
      submitEntry("/entries", body, document.getElementById("text-status"));
    });

    function wireFileInput(inputId, url, statusId) {
      const input = document.getElementById(inputId);
      const statusEl = document.getElementById(statusId);
      input.addEventListener("change", () => {
        if (!input.files.length) return;
        const body = new FormData();
        body.set("file", input.files[0]);
        submitEntry(url, body, statusEl);
      });
    }

    wireFileInput("audio-upload-input", "/entries/audio", "audio-status");
    wireFileInput("audio-capture-input", "/entries/audio", "audio-status");
    wireFileInput("video-upload-input", "/entries/video", "video-status");
    wireFileInput("video-capture-input", "/entries/video", "video-status");
  </script>
{% endblock %}
