# Local self-hosted dev environment: Postgres (entries/metadata) + MinIO
# (S3-compatible object storage for audio/video files) + Mosquitto (MQTT
# broker, for the voice-triggered journal-entry bridge -- see
# mqtt_bridge.py). Postgres/MinIO speak standard protocols specifically so
# switching to managed cloud later (Supabase/Neon, Cloudflare R2) is a
# connection-string/endpoint change, not a rewrite -- see README's storage
# section.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: soliloquy
      POSTGRES_PASSWORD: soliloquy
      POSTGRES_DB: soliloquy
    ports:
      # Host port 5433, not 5432 -- avoids colliding with any Postgres
      # already running natively on this machine.
      - "5433:5432"
    volumes:
      - soliloquy_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: soliloquy
      MINIO_ROOT_PASSWORD: soliloquy123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - soliloquy_minio_data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - soliloquy_mosquitto_data:/mosquitto/data

volumes:
  soliloquy_postgres_data:
  soliloquy_minio_data:
  soliloquy_mosquitto_data:
