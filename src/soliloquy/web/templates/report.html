{% extends "base.html" %}
{% block title %}Report — Soliloquy{% endblock %}
{% block content %}
  <h1>Report</h1>
  <p>Generates a readable write-up from entries in the date range. "self" includes everything;
     "partner"/"provider" only include entries explicitly marked shared with that audience.</p>

  <form id="report-form">
    <label>Days back
      <input type="number" name="days" value="30" min="1" required>
    </label>
    <label>Audience
      <select name="audience">
        {% for audience in audiences %}
          <option value="{{ audience }}">{{ audience }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Format
      <select name="format">
        <option value="text">Plain text (.txt)</option>
        <option value="markdown" selected>Markdown (.md)</option>
        <option value="html">HTML page (.html)</option>
        <option value="pdf">PDF (.pdf)</option>
      </select>
    </label>
    <button type="submit">Generate</button>
    <div class="status" id="report-status"></div>
  </form>

  <div id="report-output"></div>

  <script>
    const form = document.getElementById("report-form");
    const statusEl = document.getElementById("report-status");
    const outputEl = document.getElementById("report-output");

    const EXTENSIONS = { text: "txt", markdown: "md", html: "html", pdf: "pdf" };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "Generating (calls an AI provider, may take a few seconds)...";
      statusEl.className = "status";
      outputEl.innerHTML = "";

      const body = new FormData(form);
      const format = body.get("format");
      const response = await fetch("/reports", { method: "POST", body });

      if (!response.ok) {
        const detail = await response.json().catch(() => ({}));
        statusEl.textContent = detail.detail || `Request failed (${response.status})`;
        statusEl.className = "status error";
        return;
      }

      statusEl.textContent = "Done.";
      statusEl.className = "status ok";

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = `soliloquy-report.${EXTENSIONS[format]}`;
      link.textContent = `Download report (.${EXTENSIONS[format]})`;
      outputEl.appendChild(link);

      if (format === "text" || format === "markdown") {
        const pre = document.createElement("pre");
        pre.className = "report";
        pre.textContent = await blob.text();
        outputEl.appendChild(pre);
      } else if (format === "html") {
        const iframe = document.createElement("iframe");
        iframe.src = url;
        iframe.style.width = "100%";
        iframe.style.height = "500px";
        iframe.style.border = "1px solid #ddd";
        iframe.style.borderRadius = "8px";
        iframe.style.marginTop = "1rem";
        outputEl.appendChild(iframe);
      } else if (format === "pdf") {
        const embed = document.createElement("embed");
        embed.src = url;
        embed.type = "application/pdf";
        embed.style.width = "100%";
        embed.style.height = "500px";
        embed.style.marginTop = "1rem";
        outputEl.appendChild(embed);
      }
    });
  </script>
{% endblock %}
