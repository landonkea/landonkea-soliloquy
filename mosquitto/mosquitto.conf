# Local self-hosted dev broker -- anonymous access, no TLS. Fine for
# "runs on localhost, nothing exposed beyond this machine" (the same
# posture as the Postgres/MinIO credentials in docker-compose.yml).
# Add authentication/TLS before ever exposing port 1883 beyond
# localhost.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
