# Everything Soliloquy needs, in one file: Postgres (entries/metadata),
# MinIO (S3-compatible object storage for audio/video), Mosquitto (MQTT
# broker for the voice-triggered journal-entry bridge, see
# mqtt_bridge.py), and the app itself. `docker compose up -d --build`
# with a `.env` in place (`cp .env.example .env` first) is the whole
# setup -- no host Python, no Homebrew ffmpeg, no Rust toolchain, all of
# that now lives inside the image (see Dockerfile). `start.command`'s
# host-Python flow still works and is still faster for active
# development (no image rebuild for a code change, since uvicorn's
# --reload plus a live venv beats even the bind-mounted container
# restart loop), but it's no longer the only path, or the one a fresh
# clone needs to work through first.
#
# Postgres/MinIO speak standard protocols specifically so switching to
# managed cloud later (Supabase/Neon, Cloudflare R2) is a
# connection-string/endpoint change, not a rewrite -- see README's
# storage section.
#
# Port bindings, and why they differ between services: nothing outside
# this machine ever needs to reach Postgres or MinIO directly -- the web
# app (bound to 0.0.0.0, reachable from your phone on purpose) is the
# only client of either, proxying media through its own /media route
# rather than letting a browser hit MinIO directly. So both are bound to
# 127.0.0.1 here, closing off the dev credentials in this file from the
# rest of the LAN, with no change to how anything already works. Mosquitto
# is the one exception, left on 0.0.0.0 on purpose: makeItSoNumberOne's
# journal_entry plugin is expected to publish to it from a separate
# device on the LAN, so localhost-only would break that feature outright.
# Real auth/TLS on that port (see mosquitto/mosquitto.conf) is still an
# open item, tracked in CHECKLIST.md.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: soliloquy
      POSTGRES_PASSWORD: soliloquy
      POSTGRES_DB: soliloquy
    ports:
      # Host port 5433, not 5432 -- avoids colliding with any Postgres
      # already running natively on this machine. 127.0.0.1-only: see
      # note above.
      - "127.0.0.1:5433:5432"
    volumes:
      - soliloquy_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: soliloquy
      MINIO_ROOT_PASSWORD: soliloquy123
    ports:
      # 127.0.0.1-only: see note above.
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - soliloquy_minio_data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      # Deliberately left on 0.0.0.0, not 127.0.0.1: see note above.
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - soliloquy_mosquitto_data:/mosquitto/data

  app:
    build:
      context: .
      target: dev
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      # Copy .env.example to .env first -- this is the same file
      # `python -m soliloquy.web` reads when run on the host, see
      # README's Quick start.
      - .env
    environment:
      # .env's DATABASE_URL/S3_ENDPOINT_URL/MQTT_HOST point at
      # localhost, correct for the app running directly on the host,
      # but "localhost" from inside this container means the
      # container itself. Compose gives every service in a project a
      # DNS name matching its service name, so these three point at
      # the containers next to this one instead, overriding whatever
      # .env says (Compose's `environment:` wins over `env_file:`).
      DATABASE_URL: postgresql://soliloquy:soliloquy@postgres:5432/soliloquy
      S3_ENDPOINT_URL: http://minio:9000
      MQTT_HOST: mosquitto
    depends_on:
      - postgres
      - minio
      - mosquitto
    volumes:
      # Bind-mount source over the image's copy so `--reload` (the dev
      # target's CMD) picks up host edits without a rebuild.
      - ./src:/app/src

volumes:
  soliloquy_postgres_data:
  soliloquy_minio_data:
  soliloquy_mosquitto_data:
