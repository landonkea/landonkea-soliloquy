[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soliloquy"
version = "0.1.0"
description = "A voice-first journal: record, transcribe, and analyze your own thoughts over time."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
soliloquy = "soliloquy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
